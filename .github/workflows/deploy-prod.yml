name: deploy-prod

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Discord 알림 - 배포 시작
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "🚀 [prod] 배포 시작"
          description: "릴리스 `${{ github.event.release.tag_name }}` 배포를 시작합니다."
          color: 0x5865F2
          nofail: true

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (테스트 제외 - 컴파일/ktlint 게이트 + 배포용 bootJar 생성)
        run: ./gradlew build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dongchimi:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dongchimi:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dongchimi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Deploy on EC2 (blue-green switch)
        uses: appleboy/ssh-action@v1
        env:
          GCP_SA_KEY_BASE64: ${{ secrets.GCP_SA_KEY_BASE64 }}
          IMAGE_TAG: ${{ github.sha }}       # 새 이미지 태그(=커밋 SHA)를 원격 배포 스크립트에 전달
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GCP_SA_KEY_BASE64,IMAGE_TAG  # Vertex 서비스 계정 키(base64) + 이미지 태그를 원격 스크립트로 전달
          script: |
            cd /opt/dongchimi/docker/prod
            # 서비스 계정 키를 EC2에서 파일화 (compose가 마운트하므로 up 전에 존재해야 함)
            mkdir -p secrets
            echo "$GCP_SA_KEY_BASE64" | base64 -d > secrets/gcp-sa.json
            chmod 600 secrets/gcp-sa.json
            # 최신 compose/Caddyfile/deploy.sh 반영 (런타임 파일 upstream.conf·active_color는 gitignore라 충돌 없음)
            git -C /opt/dongchimi pull --ff-only
            # 블루그린 전환: 반대 색으로 새 이미지 기동 → healthy 시 무중단 전환 → 이전 색 정지
            IMAGE_TAG="$IMAGE_TAG" bash deploy.sh

  notify:
    needs: [build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 배포 결과 판정
        id: result
        run: |
          if [ "${{ needs.build-and-push.result }}" = "success" ] && [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.build-and-push.result }}" = "cancelled" ] || [ "${{ needs.deploy.result }}" = "cancelled" ]; then
            echo "status=cancelled" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Discord 알림 - 배포 결과
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ steps.result.outputs.status }}
          title: "[prod] 배포 결과"
          nofail: true
